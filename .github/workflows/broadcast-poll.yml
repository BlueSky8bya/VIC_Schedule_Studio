# 방송 ON/OFF 백업 폴러 — GitHub Actions가 주기적으로 우리 서버의 broadcast-poll을 때려,
# 시청자가 없어도(새벽·무관중) 라이브 상태가 표본된다. Vercel Hobby cron은 하루 1회뿐이라
# 그 공백에 연속 방송이 쪼개져 다음날로 오귀속되던 버그가 있었다(BNO 판정으로 이미 안전망은 넣었고,
# 이 워크플로우는 표본 자체를 늘려 시작/종료 시각 정확도까지 올린다).
#
# 왜 GitHub Actions인가: 외부 서비스 가입 없이 이 저장소 안에서 관리(버전관리·재현). 스케줄은
# best-effort(GH 부하 시 지연/건너뜀 가능)이며 60일간 커밋이 없으면 자동 비활성 — 이 repo는 활발해 문제 없다.
#
# 💰 Actions 분 예산(2026-10-20, 비공개 저장소 전환 대비): 비공개 저장소는 계정 전체 월 2,000분(Free)을
#   나눠 쓰고, 과금은 실행(job)마다 1분 단위로 올림된다. 실측(2026-09-20~10-20): 이 워크플로우 166회
#   ("*/5" 표기에도 평균 약 4.3시간 간격), warm 163회, quality 67회×평균 5.1분 — 합계 약 760분.
#   → 매시 1회 + 1분 상한으로 이 워크플로우의 최악 월 744분을 보장하고(실측 간격보다 오히려 촘촘),
#     warm.yml은 삭제했다. quality는 문서만 바뀐 push를 건너뛰고 15분 상한(quality.yml 참조).
#   진짜 5분 감지가 필요하면 GH 분을 쓰지 않는 외부 크론(cron-job.org)에 같은 URL을
#   `Authorization: Bearer <CRON_SECRET>` 헤더와 함께 등록한다(실패가 반복되면 그쪽이 잡을 끄니 상태 확인).
#
# ⚠ 실측(2026-08-04): GH 스케줄은 표기보다 훨씬 드물게 돈다(스로틀).
# 그래서 이걸 시작/종료 시각의 유일한 정밀도 근거로 삼으면 안 된다. 지금은
#   · 시작 = 라이브 응답의 BTIME(경과 초) → 폴링이 늦어도 정확
#   · 종료 = 다시보기(VOD) 등록시각/길이 보정(48시간 재시도 창)
# 이 두 정답값이 정밀도를 책임지고, 이 워크플로우는 '방송이 끝났음을 알아채는' 신호에 가깝다.
name: broadcast-poll

on:
  schedule:
    # 매시 7분(정각 혼잡 회피). 표기는 UTC지만 라이브 감지엔 무관.
    # 2026-09-28 확인: cron-job.org 방송 감지 잡은 7/20부터 Inactive — 이 폴이 주 감지다.
    # 2026-10-20: "*/5"는 실측 평균 4.3시간 간격이었다 → 매시로 바꿔 분 예산 상한을 보장한다.
    - cron: "7 * * * *"
  workflow_dispatch: {} # 수동 실행(테스트)도 허용

# 동시 실행 방지 — 겹쳐 돌 필요 없다(각 실행은 순간 폴 1회).
concurrency:
  group: broadcast-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 1 # 실측 평균 0.2분. 1분 상한 → 실행당 최대 1분 과금
    steps:
      - name: Ping broadcast-poll
        env:
          # 배포 도메인. 커스텀 도메인을 쓰면 저장소 Variables에 SITE_URL을 넣어 덮어쓴다.
          SITE_URL: ${{ vars.SITE_URL || 'https://vic-schedule-studio.vercel.app' }}
          # Vercel 환경변수 CRON_SECRET과 '같은 값'을 저장소 Secrets에 CRON_SECRET로 넣어야 한다.
          # (prod 엔드포인트가 Bearer로 인증 — 없으면 401.)
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 45 -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/broadcast-poll")
          echo "HTTP ${code}"
          cat /tmp/out.txt
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::broadcast-poll returned ${code} (CRON_SECRET 저장소 시크릿이 Vercel과 일치하는지 확인)"
            exit 1
          fi
