# A bounded anonymous readiness probe, not a full calendar/cache SSR warm.
# GitHub scheduling is best-effort. External jobs must use this same endpoint;
# this workflow does not change those jobs or promise a warm Fluid instance.
name: warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public readiness
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vic-schedule-studio.vercel.app' }}
        run: |
          set -eu
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${SITE_URL%/}/api/warm")
          echo "/api/warm -> HTTP ${code}"
          if [ "${code}" != "204" ]; then
            echo "::error::public readiness returned ${code}"
            exit 1
          fi
