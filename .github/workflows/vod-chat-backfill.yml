# 다시보기 채팅 단어 백필(0088/0089) — 옛 방송 400여 개의 채팅 리플레이를 조금씩 받아 검색 은어·관련어를 배운다.
# New and archived VODs share an independent retry queue, including while live.
# Each call attempts at most120 five-minute windows, with a35-second collection budget.
# Independent recurring queue: retries gaps, recovers legacy false-complete rows,
# and rechecks old sources. Timeline edits invalidate contextual analysis immediately.
# 원문·닉은 저장하지 않는다(단어 빈도만). CRON_SECRET 저장소 시크릿은 broadcast-poll과 같은 것을 쓴다.
name: vod-chat-backfill

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: vod-chat-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch a slice of VOD chat terms
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vic-schedule-studio.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 90 -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/vod-chat?limit=4&chunks=120")
          echo "HTTP ${code}"
          cat /tmp/out.txt
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::vod-chat returned ${code}"
            exit 1
          fi
