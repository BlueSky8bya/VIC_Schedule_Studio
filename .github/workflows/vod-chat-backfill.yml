# 다시보기 채팅 단어 백필(0088/0089) — 옛 방송 400여 개의 채팅 리플레이를 조금씩 받아 검색 은어·관련어를 배운다.
# 평시 증분(방송 정리 때 1 VOD·40조각)만으로는 몇 주 걸리므로 GH Actions가 거들어 준다.
# GH 스케줄은 실효 1~2시간 간격(스로틀)이라, 한 번에 VOD 4개·조각 120개(≈ 20시간 분량, 함수 60초 안)를 받는다.
# 다 받은 VOD는 vod_chat_sync.complete=true라 다시 안 받는다 — 백필이 끝나면 이 워크플로우는 사실상 no-op.
# 원문·닉은 저장하지 않는다(단어 빈도만). CRON_SECRET 저장소 시크릿은 broadcast-poll과 같은 것을 쓴다.
name: vod-chat-backfill

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: vod-chat-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch a slice of VOD chat terms
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vic-schedule-studio.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 90 -o /tmp/out.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/vod-chat?limit=4&chunks=120")
          echo "HTTP ${code}"
          cat /tmp/out.txt
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::vod-chat returned ${code}"
            exit 1
          fi
