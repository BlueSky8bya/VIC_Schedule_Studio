# Credential-free gates. Windows visual baselines/real-session and OBS checks
# remain separate; this Linux job never runs production DB integration tests.
name: quality

# Actions minute budget (2026-10-20, private-repo prep): measured 67 runs/30 days,
# avg 5.1 min. Docs-only changes cannot affect these gates, so they are skipped;
# the 15-minute cap bounds a hung run. See broadcast-poll.yml for the account budget.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".scratch-pw/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".scratch-pw/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Unit tests
        # Several contract tests spawn real compiler/CLI child processes.
        # Bound CPU contention while retaining each test's explicit timeout.
        run: npm test -- --maxWorkers=1

      - name: Isolated SQL contracts
        # PGlite is in-memory PostgreSQL/WASM; these scripts never read .env.
        run: |
          node tests/sql/privacy-boundary.mjs node_modules/@electric-sql/pglite/dist/index.js
          node tests/sql/event-heart-initplan.mjs node_modules/@electric-sql/pglite/dist/index.js
          node tests/sql/vod-timeline-variants.mjs node_modules/@electric-sql/pglite/dist/index.js
          node tests/sql/vod-chat-recovery.mjs node_modules/@electric-sql/pglite/dist/index.js
          node tests/sql/broadcast-work-bounds.mjs

      - name: Agent harness
        run: npm run harness:verify

      - name: Production build
        # Fetch the real Google CSS/fonts with bounded Node connections. No
        # font mocks, credentials, TLS bypass or production font changes.
        env:
          NODE_OPTIONS: --import=./scripts/ci-network-budget.mjs
        run: npm run build

      # Next.js owns .next/types during the build. Run tsc afterwards in this
      # same sequential job; concurrent build/tsc causes partial generated types.
      - name: Typecheck generated routes and source
        run: npm run typecheck

      - name: Lint
        run: npm run lint
