review_protocol_scope: "Dated source release and selected memory/art routing review; not a full schema 2.1 migration"

project:
  name: "VIC Schedule Studio"
  version: "0.1.0"
  type:
    - web
    - frontend
    - fullstack # Next.js App Router server actions + Supabase
  status: "active"

# 실제 위험 경계가 있는 프로필만 켠다(공개/비공개 분리가 이 제품의 핵심 약속).
risk_profiles:
  - GENERAL
  - SECURITY # 공개 API·공개 로더가 비공개 데이터를 절대 흘리면 안 됨
  - PRIVACY # 엠바고(owner_private)·work 범위 일정(서버 모델만 잔존), 본문 AES-256-GCM 암호화
  - AUTH # Google 로그인 + 패스코드(최초공개 게이트), 역할(owner/developer/viewer)
  - DESTRUCTIVE_DATA # db/migrations 수동 적용, 키 분실 시 복호 불가

entrypoints:
  constitution: "docs/agent/CONSTITUTION.md"
  current_state: "docs/agent/CURRENT_STATE.md"
  project_map: "docs/agent/PROJECT_MAP.md"
  risk_profile: "docs/agent/RISK_PROFILE.md"
  definition_of_done: "docs/agent/DEFINITION_OF_DONE.md"
  changelog: "docs/agent/CHANGELOG_AGENT.md"
  decision_index: "docs/agent/decisions/DECISION_INDEX.md"
  active_plan: "docs/agent/plans/ACTIVE_PLAN.md"
  rules_entry: "AGENTS.md"
  roles: "AGENTS.md"
  sop: "docs/sop.md"
  security_boundary: "docs/security-boundary.md"
  architecture: "docs/architecture.md"

commands:
  install: "npm install"
  dev: "npm run dev"
  typecheck: "npm run typecheck"
  lint: "npm run lint" # eslint --max-warnings=0
  build: "npm run build" # 커밋 전 exit code 확인(경고=실패 → Vercel 배포 막힘)
  test: "npm run test" # vitest
  test_e2e: "npm run test:e2e"
  test_visual: "npm run test:visual"
  # 실제 Supabase에 왕복한다(자격증명 없으면 스스로 건너뜀). 과거 달에만 쓰고 끝나면 물리 삭제.
  test_integration: "npm run test:integration"
  harness_verify: "npm run harness:verify"
  migrate: "node scripts/apply-db.mjs db/migrations/<file>.sql" # 수동·멱등, .env.local 사용

version_policy: "semver"

agent_policy:
  default_task_risk: "L1"
  ask_before_production_dependency: true
  ask_before_destructive_command: true
  ask_before_public_api_break: true
  auto_commit: false # 사용자가 요청하거나 명백히 기대될 때만
  auto_push: false # push = main = Vercel 프로덕션 자동배포
  update_current_state_after: "현재 목표·활성 작업·차단·다음 행동이 달라질 때 교체; 완료 이력은 관련 기록으로"
  documentation_impact: "관련 도메인 문서/결정 기록 또는 정확한 변경 해시에 묶인 영향 없음 사유"

# Project-specific UTF-8 byte budgets, not token counts. Overflow fails; no silent truncation.
memory:
  agents_max_bytes: 6144
  claude_max_bytes: 1024
  current_state_max_bytes: 8192
  active_plan_max_bytes: 4096
  brief_max_bytes: 8192
  always_loaded_max_bytes: 16384
  historical_snapshots: "docs/agent/archive/"
  validation: "npm run harness:verify"

hook_adapters:
  claude:
    configuration: ".claude/settings.json"
    session_start: "scripts/agent-harness/session-brief.mjs"
    session_stop: "scripts/agent-harness/state-drift-check.mjs"
    baseline: "session_id from hook stdin; explicit --session ID supported for manual use"
    runtime_activation: "NOT VERIFIED in host; configuration and isolated CLI behavior tested separately"
    drift_enforcement: "advisory; cannot establish semantic correctness or infer absent session evidence"
  other_agents: "Read AGENTS.md; run harness:verify explicitly. Claude hook activation is not assumed."
